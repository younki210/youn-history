<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 역사 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- 시작 화면 -->
        <div id="start-screen" class="screen active">
            <h1>📜 오늘의 역사 퀴즈</h1>
            <p>수업을 시작하기 전, 배운 내용을 확인해볼까요?</p>
            <button id="start-btn">퀴즈 시작하기</button>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="screen hide">
            <div class="header">
                <span id="question-count">문제 1 / 3</span>
                <span id="score-display">점수: 0</span>
            </div>
            <h2 id="question-text">여기에 문제가 표시됩니다.</h2>
            <div id="options-container" class="options">
                <!-- 선택지가 여기에 자바스크립트로 생성됩니다 -->
            </div>
            <button id="next-btn" class="hide">다음 문제</button>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="screen hide">
            <h1>🎉 퀴즈 완료!</h1>
            <p id="final-score">총점: 0점</p>
            <p id="feedback-msg">참 잘했어요!</p>
            <button id="restart-btn">다시 풀기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
